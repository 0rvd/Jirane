<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيراني - الدخول الآمن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --primary: #38bdf8;
    --text-main: #f8fafc;
    --border-color: #334155;
}

body {
    font-family: 'Tajawal', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex; 
    justify-content: center; 
    align-items: center;
    min-height: 100vh; 
    margin: 0; 
    padding: 20px; 
    box-sizing: border-box;
    position: relative;
}

/* ضبط موقع ترجمة قوقل أعلى اليسار */
.lang-picker-container {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
}

.auth-container {
    background-color: var(--card-bg);
    padding: 35px 30px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    width: 100%; 
    max-width: 400px; 
    text-align: center;
    box-sizing: border-box;
}

.brand-logo i { 
    font-size: 42px; 
    color: var(--primary); 
    margin-bottom: 10px; 
}

.brand-header h1 { 
    font-size: 24px; 
    margin: 0; 
}

.brand-header p { 
    font-size: 13px; 
    color: #94a3b8; 
    margin-top: 5px; 
    margin-bottom: 25px; 
}

/* ضبط الحقول مع الأيقونات بداخلها */
.input-group { 
    position: relative; 
    margin-bottom: 15px; 
    display: flex;
    align-items: center;
}

.input-group i { 
    position: absolute; 
    right: 15px; 
    color: #94a3b8; 
    font-size: 16px;
    pointer-events: none;
}

input, select {
    width: 100%; 
    padding: 12px 42px 12px 15px; /* مساحة للأيقونة على اليمين */
    background-color: #0f172a; 
    color: white;
    border: 1px solid var(--border-color);
    border-radius: 8px; 
    box-sizing: border-box; 
    outline: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
}

select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
}

.btn-submit {
    width: 100%; 
    padding: 12px;
    background-color: var(--primary); 
    color: #0f172a;
    border: none; 
    border-radius: 8px;
    font-weight: bold; 
    font-size: 15px;
    cursor: pointer; 
    margin-top: 10px;
}

.toggle-link { 
    margin-top: 20px; 
    font-size: 13px; 
    color: #94a3b8; 
}

.toggle-link span { 
    color: var(--primary); 
    cursor: pointer; 
    font-weight: bold;
    text-decoration: underline; 
}

.hidden { 
    display: none !important; 
}
    </style>
</head>
<body>

    <div class="lang-picker-container">
        <div id="google_translate_element"></div>
    </div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo"><i class="fas fa-users-viewfinder"></i></div>
            <h1>جـيـراني • Jirane</h1>
            <p id="brandSub">منصتك الحية للتكافل والخدمات السريعة</p>
        </div>

        <div id="loginBox">
            <div class="input-group">
                <input type="text" id="user" placeholder="اسم المستخدم">
                <i class="fas fa-user-tag"></i>
            </div>
            <div class="input-group">
                <input type="password" id="pass" placeholder="كلمة المرور">
                <i class="fas fa-lock"></i>
            </div>
            <button class="btn-submit" onclick="login()">دخول آمن</button>
            <div class="toggle-link">ليس لديك حساب؟ <span onclick="toggleView('signupBox')">سجل الآن</span></div>
        </div>

        <div id="signupBox" class="hidden">
            <div class="input-group">
                <input type="text" id="regName" placeholder="اسم المستخدم ">
                <i class="fas fa-user"></i>
            </div>
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="tel" id="regPhone" placeholder="رقم الجوال (10 أرقام)">
                <i class="fas fa-phone"></i>
            </div>
            <div class="input-group">
                <select id="regArea">
                    <option value="">اختر حيك السكني</option>
                    <option value="الروضة">حي الروضة</option>
                    <option value="السلامة">حي السلامة</option>
                    <option value="الفيصلية">حي الفيصلية</option>
                    <option value="النعيم">حي النعيم</option>
                    <option value="المرجان">حي المرجان</option>
                </select>
                <i class="fas fa-map-marked-alt" style="left: auto; right: 16px;"></i>
            </div>
            <div class="input-group">
                <input type="password" id="regPass" placeholder="كلمة المرور">
                <i class="fas fa-key"></i>
            </div>
            <button class="btn-submit" onclick="register()">إنشاء الحساب والانضمام للحي</button>
            <div class="toggle-link">مسجل مسبقاً؟ <span onclick="toggleView('loginBox')">تسجيل دخول</span></div>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ar',
                includedLanguages: 'ar,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // تنبيه: ينبغي استبدال SUPABASE_ANON_KEY بالمفتاح الخاص بمشروعك (JWT Format)
        const SUPABASE_URL = 'https://fdmzvtypxfoexjcwfnzq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_ZS0QXq2GkYayJ5abz8vLfg_YSFqKAhi';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleView(id) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('signupBox').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        async function login() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            if(!u || !p) { alert("أدخل البيانات كاملة"); return; }

            const userSlug = u.toLowerCase().replace(/\s+/g, '');
            const { data, error } = await _supabase.from('users').select('*').eq('username', userSlug).eq('password', p).maybeSingle();

            if (error || !data) {
                alert("خطأ في بيانات الدخول");
            } else {
                localStorage.setItem('isAuth', 'true');
                localStorage.setItem('username', data.username);
                localStorage.setItem('userPhone', data.phone);
                localStorage.setItem('userNeighborhood', data.neighborhood);
                localStorage.setItem('isAdmin', data.is_admin === 'yes' ? 'true' : 'false');
                window.location.href = 'Chat_neighborhood.html';
            }
        }

        async function register() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const phone = document.getElementById('regPhone').value.trim();
            const area = document.getElementById('regArea').value;
            const pass = document.getElementById('regPass').value;

            if(!name || !email || !phone || !area || !pass) { alert("عبئ جميع الخانات"); return; }
            const userSlug = name.toLowerCase().replace(/\s+/g, '');

            const { error } = await _supabase.from('users').insert([{ username: userSlug, email: email, phone: phone, neighborhood: area, password: pass, is_admin: 'no' }]);

            if(error) {
                alert("خطأ أثناء التسجيل: " + error.message);
            } else {
                alert(`تم إنشاء الحساب! اسم الدخول: ${userSlug}`);
                toggleView('loginBox');
            }
        }
    </script>
</body>
</html>
