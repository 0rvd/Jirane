<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيراني - طلبات الفزعة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #060814;
            --surface-panel: rgba(17, 24, 39, 0.7);
            --surface-card: rgba(30, 41, 59, 0.5);
            --border-glow: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --whatsapp: #22c55e;
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
        }

        body {
            margin: 0; background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #060814 70%);
            color: var(--text-body); font-family: 'Tajawal', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        .app-bar {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px);
            padding: 16px 6%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-glow); position: sticky; top: 0; z-index: 100;
        }

        .brand-section { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; color: var(--text-title); }
        .profile-area { display: flex; align-items: center; gap: 15px; }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px; border-radius: 12px; font-size: 13px; cursor: pointer; font-weight: 600;
        }

        .wrapper { max-width: 850px; margin: 30px auto; width: 90%; flex: 1; }

        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 25px; }

        .panel-btn {
            background: var(--surface-card); border: 1px solid var(--border-glow);
            padding: 30px 20px; border-radius: 20px; text-align: center; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .content-view { background: var(--surface-panel); backdrop-filter: blur(16px); border-radius: 24px; padding: 30px; border: 1px solid var(--border-glow); }
        .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-glow); padding-bottom: 15px; }
        
        .item-card { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.04); border-radius: 18px; padding: 20px; margin-bottom: 15px; border-right: 4px solid var(--accent); }

        .btn-whatsapp-connect {
            background: var(--whatsapp); color: #020617; text-decoration: none; padding: 8px 16px;
            border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-top: 5px;
        }

        textarea, select.input-styled {
            width: 100%; padding: 14px; background: rgba(2, 6, 23, 0.4); color: white;
            border: 1px solid var(--border-glow); border-radius: 14px; box-sizing: border-box; outline: none; margin-top: 10px;
        }

        .btn-action-trigger {
            background: linear-gradient(135deg, var(--accent) 0%, #0284c7 100%); color: #020617;
            border: none; padding: 14px; width: 100%; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 20px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-section">
            <i class="fas fa-building-user" style="color:var(--accent);"></i>
            <span>جـيـراني</span>
        </div>
        <div class="profile-area">
            <!-- خيار اللغة -->
            <div id="google_translate_element"></div>
            <button class="btn-logout" onclick="localStorage.clear(); location.href='index.html'">خروج</button>
        </div>
    </header>

    <div class="wrapper">
        <div id="roleSelect">
            <div class="grid-menu">
                <div class="panel-btn" onclick="showView('feedView')">
                    <i class="fas fa-hand-holding-hand" style="font-size:32px; color: var(--accent);"></i>
                    <h3 style="margin:0; color:white;">ساحة الفزعات والطلبات</h3>
                    <p style="margin:0; font-size:13px; color:#94a3b8;">تصفح واقبل الطلبات المتاحة لخدمة جيرانك</p>
                </div>
                <div class="panel-btn" onclick="showView('requestView')">
                    <i class="fas fa-paper-plane" style="font-size:32px; color: #60a5fa;"></i>
                    <h3 style="margin:0; color:white;">طلب مساعدة جديدة</h3>
                    <p style="margin:0; font-size:13px; color:#94a3b8;">اطلب فزعة عاجلة ليصل طلبك لسكان الحي</p>
                </div>
            </div>
        </div>

        <!-- قائمة الفزعات والقبول -->
        <div id="feedView" class="content-view hidden">
            <div class="view-header">
                <h3>طلبات الفزعة القائمة</h3>
                <span onclick="backToRoles()" style="color:var(--accent); cursor:pointer;"><i class="fas fa-arrow-left"></i> العودة</span>
            </div>
            <div id="requestsFeed"></div>
        </div>

        <!-- إنشاء طلب جديد -->
        <div id="requestView" class="content-view hidden">
            <div class="view-header">
                <h3>تأكيد فزعة جديدة</h3>
                <span onclick="backToRoles()" style="color:var(--accent); cursor:pointer;"><i class="fas fa-arrow-left"></i> العودة</span>
            </div>
            
            <label>اختر نوع المساعدة:</label>
            <select id="serviceType" class="input-styled" onchange="checkCategory()">
                <option value="🚗 تعطل سيارة / اشتراك بطارية">🚗 تعطل سيارة / اشتراك بطارية</option>
                <option value="🛠 فزعة سباكة / كهرباء طارئة">🛠 فزعة سباكة / كهرباء طارئة</option>
                <option value="📦 نقل وتنزيل أغراض ثقيلة">📦 نقل وتنزيل أغراض ثقيلة</option>
                <option value="🛒 توصيل مقاضي عاجلة للبيت">🛒 توصيل مقاضي عاجلة للبيت</option>
                <option value="أخرى">❓ طلب مخصص آخر</option>
            </select>
            
            <div id="specialDetailsBox" class="hidden">
                <textarea id="serviceDetails" placeholder="اكتب تفاصيل طلب المساعدة والموقع..."></textarea>
            </div>

            <button class="btn-action-trigger" onclick="postNewRequest()">بث طلب المساعدة</button>
        </div>
    </div>

    <!-- سكريبت قوقل للترجمة -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ar',
                includedLanguages: 'ar,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const SUPABASE_URL = 'https://fdmzvtypxfoexjcwfnzq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_ZS0QXq2GkYayJ5abz8vLfg_YSFqKAhi';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if(localStorage.getItem('isAuth') !== 'true') window.location.href = 'index.html';

        const uName = localStorage.getItem('username');
        const uNeighborhood = localStorage.getItem('userNeighborhood');
        const userPhone = localStorage.getItem('userPhone');

        function checkCategory() {
            const cat = document.getElementById('serviceType').value;
            const box = document.getElementById('specialDetailsBox');
            if(cat === 'أخرى') box.classList.remove('hidden');
            else { box.classList.add('hidden'); document.getElementById('serviceDetails').value = ""; }
        }

        async function loadAreaRequests() {
            const feed = document.getElementById('requestsFeed');
            feed.innerHTML = ""; 

            const { data, error } = await _supabase
                .from('requests')
                .select('*')
                .eq('neighborhood', uNeighborhood)
                .order('created_at', { ascending: false });

            if (!error && data) {
                if(data.length === 0) {
                    feed.innerHTML = "<p style='text-align:center;'>لا توجد طلبات قائمة في هذا الحي حالياً.</p>";
                    return;
                }
                data.forEach(req => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    
                    const rawPhone = req.phone ? req.phone.toString().trim() : '';
                    const cleanPhone = rawPhone.replace(/^0/, ''); 
                    const whatsappUrl = cleanPhone ? `https://wa.me/966${cleanPhone}` : '#';

                    card.innerHTML = `
                        <div style="font-size:13px; color:#94a3b8; display:flex; justify-content:space-between;">
                            <span><i class="fas fa-user"></i> ${req.user_name}</span>
                            <span style="color:#4ade80;">نشط</span>
                        </div>
                        <div style="margin: 12px 0; color:white;">
                            <strong>التصنيف: ${req.request_type}</strong>
                            ${req.details ? '<p style="color:#94a3b8; margin:5px 0 0 0;">' + req.details + '</p>' : ''}
                        </div>
                        <a href="${whatsappUrl}" target="_blank" class="btn-whatsapp-connect" ${!cleanPhone ? 'onclick="alert(\'رقم الجوال غير متوفر\'); return false;"' : ''}>
                            <i class="fab fa-whatsapp"></i> قبول الطلب والتواصل المباشر
                        </a>
                    `;
                    feed.appendChild(card);
                });
            }
        }

        async function postNewRequest() {
            const type = document.getElementById('serviceType').value;
            let details = "طلب فزعة طارئ ومستعجل";

            if(type === 'أخرى') {
                const textVal = document.getElementById('serviceDetails').value.trim();
                if(!textVal) { alert("أدخل التفاصيل أولاً!"); return; }
                details = textVal;
            }

            const { error } = await _supabase
                .from('requests')
                .insert([{ 
                    user_name: uName, 
                    phone: userPhone, 
                    request_type: type, 
                    details: details, 
                    neighborhood: uNeighborhood 
                }]);

            if (!error) {
                alert("تم نشر الطلب بنجاح!");
                document.getElementById('serviceDetails').value = "";
                showView('feedView');
            } else {
                alert("خطأ: " + error.message);
            }
        }

        function showView(viewId) {
            document.getElementById('roleSelect').classList.add('hidden');
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('requestView').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId === 'feedView') loadAreaRequests();
        }

        function backToRoles() {
            document.getElementById('roleSelect').classList.remove('hidden');
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('requestView').classList.add('hidden');
        }
    </script>
</body>
</html>
