<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيراني - طلبات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
    --bg-color: #111827;
    --card-bg: #1f2937;
    --primary: #38bdf8;
    --text-main: #f9fafb;
    --border-color: #374151;
    --whatsapp: #22c55e;
}

body {
    margin: 0; background-color: var(--bg-color); color: var(--text-main);
    font-family: 'Tajawal', sans-serif; display: flex; flex-direction: column; min-height: 100vh;
}

.app-bar {
    background-color: var(--card-bg); padding: 15px 5%;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-color);
}

.neighborhood-badge-select {
    background: transparent; border: 1px solid var(--primary); color: var(--primary);
    padding: 5px 10px; border-radius: 5px; margin-right: 10px;
}

.btn-logout { background-color: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

.wrapper { max-width: 800px; margin: 30px auto; width: 90%; flex: 1; }

.grid-menu { display: flex; gap: 15px; flex-wrap: wrap; }
.panel-btn {
    background-color: var(--card-bg); flex: 1; min-width: 200px;
    padding: 25px; border-radius: 10px; text-align: center;
    border: 1px solid var(--border-color); cursor: pointer;
}

.content-view { background-color: var(--card-bg); padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); }
.view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

.item-card {
    background-color: #374151; padding: 15px; border-radius: 8px;
    margin-bottom: 15px; border-right: 4px solid var(--primary);
}

.btn-whatsapp-connect { background-color: var(--whatsapp); color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; display: inline-block; margin-top: 10px; }

textarea, select.input-styled {
    width: 100%; padding: 12px; background-color: #374151; color: white;
    border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; margin-top: 10px;
}

.btn-action-trigger {
    background-color: var(--primary); color: #111827; border: none; padding: 12px;
    width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px;
}
.hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="brand-section">
            <i class="fas fa-building-user" style="color:var(--accent);"></i>
            <span>جـيـراني</span>
            
            <!-- قائمة الحي -->
            <select id="neighborhoodSelect" class="neighborhood-badge-select" onchange="changeActiveNeighborhood(this.value)">
                <option value="الروضة">حي الروضة</option>
                <option value="السلامة">حي السلامة</option>
                <option value="الفيصلية">حي الفيصلية</option>
                <option value="النعيم">حي النعيم</option>
                <option value="المرجان">حي المرجان</option>
            </select>
        </div>
        <div class="profile-area">
            <div id="google_translate_element"></div>
            <button class="btn-logout" onclick="localStorage.clear(); location.href='index.html'">خروج</button>
        </div>
    </header>

    <div class="wrapper">
        <div id="roleSelect">
            <div class="grid-menu">
                <div class="panel-btn" onclick="showView('feedView')">
                    <i class="fas fa-hand-holding-hand" style="font-size:32px; color: var(--accent);"></i>
                    <h3 style="margin:0; color:white;">الطلبات الحالية</h3>
                    <p style="margin:0; font-size:13px; color:#94a3b8;">تصفح واقبل الطلبات المتاحة لخدمة جيرانك</p>
                </div>
                <div class="panel-btn" onclick="showView('requestView')">
                    <i class="fa-regular fa-paper-plane" style="font-size:32px; color: white;"></i>
                    <h3 style="margin:0; color:white;">طلب مساعدة جديدة</h3>
                    <p style="margin:0; font-size:13px; color:#94a3b8;">اطلب مساعدة عاجلة ليصل طلبك لسكان الحي</p>
                </div>
            </div>
        </div>

        <div id="feedView" class="content-view hidden">
            <div class="view-header">
                <h3>قائمة الطلبات الحالية</h3>
                <span onclick="backToRoles()" style="color:var(--accent); cursor:pointer;"><i class="fas fa-arrow-left"></i> العودة</span>
            </div>
            <div id="requestsFeed"></div>
        </div>

        <div id="requestView" class="content-view hidden">
            <div class="view-header">
                <h3>انشاء طلب مساعدة</h3>
                <span onclick="backToRoles()" style="color:var(--accent); cursor:pointer;"><i class="fas fa-arrow-left"></i> العودة</span>
            </div>
            
            <label>اختر نوع المساعدة:</label>
            <select id="serviceType" class="input-styled" onchange="checkCategory()">
                <option value="🚗 تعطل سيارة / اشتراك بطارية">🚗 تعطل سيارة / اشتراك بطارية</option>
                <option value="🛠 مشكلة سباكة / كهرباء طارئة">🛠 مشكلة سباكة / كهرباء طارئة</option>
                <option value="📦 نقل وتنزيل أغراض ثقيلة">📦 نقل وتنزيل أغراض ثقيلة</option>
                <option value="🛒 توصيل مقاضي للبيت">🛒 توصيل مقاضي للبيت</option>
                <option value="أخرى">❓ أخرى</option>
            </select>
            
            <div id="specialDetailsBox" class="hidden">
                <textarea id="serviceDetails" placeholder="اكتب تفاصيل طلب المساعدة ..."></textarea>
            </div>

            <button class="btn-action-trigger" onclick="postNewRequest()">بث طلب المساعدة</button>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ar',
                includedLanguages: 'ar,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const SUPABASE_URL = 'https://fdmzvtypxfoexjcwfnzq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_ZS0QXq2GkYayJ5abz8vLfg_YSFqKAhi';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if(localStorage.getItem('isAuth') !== 'true') window.location.href = 'index.html';

        const uName = localStorage.getItem('username');
        const userPhone = localStorage.getItem('userPhone');
        const isAdmin = localStorage.getItem('isAdmin') === 'true';
        
        // استخدام الحي المحدد حالياً أو الافتراضي للمستخدم
        let activeNeighborhood = localStorage.getItem('userNeighborhood');

        // تجهيز القائمة العلوية للحي بناءً على صلاحية الحساب
        window.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('neighborhoodSelect');
            if (selectEl) {
                selectEl.value = activeNeighborhood;
                
                // إذا لم يكن أدمن يُقفل خيار التغيير
                if (!isAdmin) {
                    selectEl.disabled = true;
                }
            }
        });

        function changeActiveNeighborhood(newArea) {
            if (!isAdmin) return;
            activeNeighborhood = newArea;
            
            // إذا كان المستخدم فاتح قائمة الطلبات يتم تحديثها فوراً
            const feedView = document.getElementById('feedView');
            if (feedView && !feedView.classList.contains('hidden')) {
                loadAreaRequests();
            }
        }

        function checkCategory() {
            const cat = document.getElementById('serviceType').value;
            const box = document.getElementById('specialDetailsBox');
            if(cat === 'أخرى') box.classList.remove('hidden');
            else { box.classList.add('hidden'); document.getElementById('serviceDetails').value = ""; }
        }

        async function loadAreaRequests() {
            const feed = document.getElementById('requestsFeed');
            feed.innerHTML = ""; 

            const { data, error } = await _supabase
                .from('requests')
                .select('*')
                .eq('neighborhood', activeNeighborhood)
                .order('created_at', { ascending: false });

            if (!error && data) {
                if(data.length === 0) {
                    feed.innerHTML = `<p style='text-align:center;'>لا توجد طلبات قائمة في ${activeNeighborhood} حالياً.</p>`;
                    return;
                }
                data.forEach(req => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    
                    const rawPhone = req.phone ? req.phone.toString().trim() : '';
                    const cleanPhone = rawPhone.replace(/^0/, ''); 
                    const whatsappUrl = cleanPhone ? `https://wa.me/966${cleanPhone}` : '#';

                    card.innerHTML = `
                        <div style="font-size:13px; color:#94a3b8; display:flex; justify-content:space-between;">
                            <span><i class="fas fa-user"></i> ${req.user_name}</span>
                            <span style="color:#4ade80;">نشط</span>
                        </div>
                        <div style="margin: 12px 0; color:white;">
                            <strong>التصنيف: ${req.request_type}</strong>
                            ${req.details ? '<p style="color:#94a3b8; margin:5px 0 0 0;">' + req.details + '</p>' : ''}
                        </div>
                        <a href="${whatsappUrl}" target="_blank" class="btn-whatsapp-connect" ${!cleanPhone ? 'onclick="alert(\'رقم الجوال غير متوفر\'); return false;"' : ''}>
                            <i class="fab fa-whatsapp"></i> قبول الطلب والتواصل المباشر
                        </a>
                    `;
                    feed.appendChild(card);
                });
            }
        }

        async function postNewRequest() {
            const type = document.getElementById('serviceType').value;
            let details = "طلب طارئ ومستعجل";

            if(type === 'أخرى') {
                const textVal = document.getElementById('serviceDetails').value.trim();
                if(!textVal) { alert("أدخل التفاصيل أولاً!"); return; }
                details = textVal;
            }

            const { error } = await _supabase
                .from('requests')
                .insert([{ 
                    user_name: uName, 
                    phone: userPhone, 
                    request_type: type, 
                    details: details, 
                    neighborhood: activeNeighborhood 
                }]);

            if (!error) {
                alert("تم نشر الطلب بنجاح!");
                document.getElementById('serviceDetails').value = "";
                showView('feedView');
            } else {
                alert("خطأ: " + error.message);
            }
        }

        function showView(viewId) {
            document.getElementById('roleSelect').classList.add('hidden');
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('requestView').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId === 'feedView') loadAreaRequests();
        }

        function backToRoles() {
            document.getElementById('roleSelect').classList.remove('hidden');
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('requestView').classList.add('hidden');
        }
    </script>
</body>
</html>
